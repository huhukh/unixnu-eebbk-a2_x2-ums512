
name: macOS kernel build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        options:
          - macos-26
          - macos-15
        default: macos-26
      xcode:
        description: Xcode version
        required: true
        default: "26.6"
      ipsw_url:
        description: Optional IPSW URL (empty uses board.toml)
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kernel:
    name: Realme C21Y - XNU kernel
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      UNIXNU_IPSW: ${{ inputs.ipsw_url }}
      DEVICE_DEFCONFIG: realme-c21y-rmx3261_defconfig

    steps:
      - name: Checkout C21Y device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Clone UniXNU core
        run: |
          set -eux

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/UniXNU/UniXNU.git \
            UniXNU

          test -f UniXNU/unixnu
          test -f UniXNU/scripts/unixnu/cli.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select Xcode
        run: |
          set -eux

          preferred="/Applications/Xcode_${{ inputs.xcode }}.app"

          if [ -d "$preferred" ]; then
            chosen="$preferred"
          else
            chosen="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          fi

          test -n "$chosen"

          echo "DEVELOPER_DIR=$chosen/Contents/Developer" >> "$GITHUB_ENV"

          sudo xcode-select -s "$chosen/Contents/Developer"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install host tools
        run: |
          set -eux

          brew install llvm lld mtools dtc

          command -v unifdef || brew install unifdef

          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

          clang --version
          ld.lld --version
          dtc --version

      - name: Validate C21Y device files
        run: |
          set -eux

          test -f device/board.toml
          test -f device/porting.toml
          test -f device/configs/$DEVICE_DEFCONFIG
          test -f device/dts/realme-c21y-rmx3261.dts

          echo "C21Y device files found."

      - name: Configure UniXNU
        working-directory: UniXNU
        run: |
          set -eux

          ./unixnu defconfig "$DEVICE_DEFCONFIG" \
            -D "$GITHUB_WORKSPACE/device"

      - name: Fetch kernel sources
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          ./unixnu fetch 2>&1 | tee "$GITHUB_WORKSPACE/fetch.log"

      - name: Assemble kernel build tree
        working-directory: UniXNU
        run: |
          set -euxo pipefail

          ./unixnu tree 2>&1 | tee "$GITHUB_WORKSPACE/tree.log"

      - name: Check resolved configuration
        working-directory: UniXNU
        run: |
          set -euxo pipefail

          ./unixnu status --json \
            | tee "$GITHUB_WORKSPACE/status.json"

          test -s "$GITHUB_WORKSPACE/status.json"

      - name: Build XNU kernel
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          ./unixnu build kernel \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel.log"

      - name: Verify kernel artifact
        run: |
          set -eux

          KERNEL="$(find UniXNU/out \
            -type f \
            -path '*/kernel/kernel.macho' \
            | head -n 1)"

          if [ -z "$KERNEL" ]; then
            echo "ERROR: kernel.macho was not generated."
            find UniXNU/out -maxdepth 7 -type f | head -200
            exit 1
          fi

          test -s "$KERNEL"

          echo "Kernel: $KERNEL"
          file "$KERNEL"
          shasum -a 256 "$KERNEL"

          echo "KERNEL_ARTIFACT=$KERNEL" >> "$GITHUB_ENV"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Realme C21Y - macOS kernel build"
            echo ""
            echo "- Device: RMX3261"
            echo "- SoC: Unisoc T610 / UMS512"
            echo "- Defconfig: $DEVICE_DEFCONFIG"
            echo "- Runner: ${{ inputs.runner }}"
            echo ""
            echo "### Kernel output"
            echo '```'
            if [ -n "${KERNEL_ARTIFACT:-}" ] && [ -f "$KERNEL_ARTIFACT" ]; then
              ls -lh "$KERNEL_ARTIFACT"
              shasum -a 256 "$KERNEL_ARTIFACT"
            else
              echo "Kernel artifact not generated."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realme-c21y-xnu-kernel
          path: |
            UniXNU/out/**/kernel/kernel.macho
            UniXNU/out/**/logs/
            fetch.log
            tree.log
            kernel.log
            status.json
          if-no-files-found: warn
          retention-days: 7
