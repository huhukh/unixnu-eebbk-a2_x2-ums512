
name: build

on:
  push:
    branches: [main, port/realme-c21y-rmx3261]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE_DEFCONFIG: realme-c21y-rmx3261_defconfig
  DEVICE_DTS: dts/realme-c21y-rmx3261.dts
  UNIXNU_DIR: UniXNU
  OUTPUT_DIR: out

jobs:
  linux-build-check:
    name: Linux - C21Y XNU 8796 build and DTS
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout C21Y device repository
        uses: actions/checkout@v4
        with:
          ref: port/realme-c21y-rmx3261

      - name: Free runner disk
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/lib/jvm \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Nodejs \
            /opt/hostedtoolcache/PyPy \
            /usr/local/lib/node_modules 2>/dev/null || true
          df -h /

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python tomllib
        run: |
          python3 --version
          python3 -c "import tomllib; print('tomllib OK')"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            python3 \
            python3-pip \
            device-tree-compiler \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            mtools \
            make \
            cmake \
            nasm \
            uuid-dev \
            acpica-tools

          python3 --version
          dtc --version
          clang --version
          df -h /

      - name: Check C21Y repository files
        run: |
          set -eux

          test -f board.toml
          test -f porting.toml
          test -f feeds.toml
          test -f "configs/$DEVICE_DEFCONFIG"
          test -f "$DEVICE_DTS"

          echo "C21Y repository files found."
          echo "Defconfig: configs/$DEVICE_DEFCONFIG"
          echo "DTS: $DEVICE_DTS"

      - name: Audit C21Y UEFI scaffold
        run: |
          set -eux
          python3 tools/c21y-uefi-audit.py
          sh -n uefi/build-c21y.sh

      - name: Clone UniXNU core
        run: |
          set -eux

          git clone \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/UniXNU/UniXNU.git \
            "$UNIXNU_DIR"

          test -f "$UNIXNU_DIR/unixnu"
          test -d "$UNIXNU_DIR/package"

      - name: Install iOS 16.5 OS profile
        run: |
          set -eux
          bash "$GITHUB_WORKSPACE/scripts/install-os-profile.sh" "$GITHUB_WORKSPACE/$UNIXNU_DIR"
          test -f "$UNIXNU_DIR/profiles/os/ios-16.5-20F66/profile.toml"

      - name: Resolve C21Y defconfig
        run: |
          set -eux

          python3 "$UNIXNU_DIR/unixnu" \
            defconfig "$DEVICE_DEFCONFIG" \
            -D "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/$OUTPUT_DIR"

          test -d "$OUTPUT_DIR"

          find "$OUTPUT_DIR" -name .config -type f -print

      - name: Fetch build sources
        run: |
          set -eux

          cd "$UNIXNU_DIR"

          python3 ./unixnu fetch \
            -D "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/$OUTPUT_DIR"

      - name: Assemble build tree
        run: |
          set -eux

          cd "$UNIXNU_DIR"

          python3 ./unixnu tree \
            -D "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/$OUTPUT_DIR"

      - name: Check resolved device configuration
        run: |
          set -eux

          cd "$UNIXNU_DIR"

          python3 ./unixnu status \
            -D "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/$OUTPUT_DIR" \
            --json | tee "$GITHUB_WORKSPACE/status.json"

          test -s "$GITHUB_WORKSPACE/status.json"

      - name: Compile C21Y device tree
        run: |
          set -eux

          mkdir -p build

          DTS="$GITHUB_WORKSPACE/$DEVICE_DTS"

          # The shared UMS512 DTS is vendored in the C21Y device repository.
          UMS512_DTS="$GITHUB_WORKSPACE/soc/UniXNU-ums512-common/dts"

          if [ ! -f "$UMS512_DTS/ums512.dtsi" ]; then
            echo "ERROR: missing $UMS512_DTS/ums512.dtsi"
            find "$GITHUB_WORKSPACE/soc" -maxdepth 5 -type f -name '*.dtsi' -print || true
            exit 1
          fi

          echo "Using UMS512 DTS directory: $UMS512_DTS"

          dtc \
            -I dts \
            -O dtb \
            -i "$UMS512_DTS" \
            -o build/realme-c21y-rmx3261.dtb \
            "$DTS"

          test -s build/realme-c21y-rmx3261.dtb

          dtc \
            -I dtb \
            -O dts \
            build/realme-c21y-rmx3261.dtb \
            -o build/realme-c21y-rmx3261-compiled.dts

          grep -q 'Realme C21Y' \
            build/realme-c21y-rmx3261-compiled.dts

          ls -lh build/

      - name: Build Linux XNU toolchain
        run: |
          set -eux
          sudo python3 "$UNIXNU_DIR/scripts/linux/setup-toolchain.py" /opt/unixnu-linux -j 2
          test -x /opt/unixnu-linux/bin/lzfse
          test -x /opt/unixnu-linux/CommandLineTools/usr/bin/ld

      - name: Build native XNU kernel
        env:
          UNIXNU_TOOLCHAIN: /opt/unixnu-linux
        run: |
          set -eux
          cd "$UNIXNU_DIR"
          python3 ./unixnu build kernel \
            --skip-prelink \
            -D "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/$OUTPUT_DIR"
          find "$GITHUB_WORKSPACE/$OUTPUT_DIR" -type f -path "*/kernel/kernel.macho" -size +0c -print -quit | grep .

      - name: Build payload image
        env:
          UNIXNU_TOOLCHAIN: /opt/unixnu-linux
          UNIXNU_UNIQUE_CHIP_ID: "0x8015"
        run: |
          set -eux
          cd "$UNIXNU_DIR"
          python3 ./unixnu build payload \
            -D "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/$OUTPUT_DIR" \
            2>&1 | tee "$GITHUB_WORKSPACE/payload.log"
          PAYLOAD=$(find "$GITHUB_WORKSPACE/$OUTPUT_DIR" -type f -path "*/payload/payload.img" -print -quit)
          test -s "$PAYLOAD"
          stat -c 'payload.img: %s bytes' "$PAYLOAD"
          # 30 MiB payload window from board.toml, fits boot_a/b (64 MiB).
          test "$(stat -c%s "$PAYLOAD")" -le 31457280

      - name: Upload build-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realme-c21y-build-check
          path: |
            build/
            out/**/kernel/kernel.macho
            out/**/payload/payload.img
            out/**/payload/payload.json
            payload.log
            out/**/logs/**
            out/**/tree/build/xnu/**/log/**
            status.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Realme C21Y Linux build-check"
            echo ""
            echo "- Defconfig: \`$DEVICE_DEFCONFIG\`"
            echo "- DTS: \`$DEVICE_DTS\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo ""
            if [ -f build/realme-c21y-rmx3261.dtb ]; then
              echo "Device Tree compilation: SUCCESS"
            else
              echo "Device Tree compilation: FAILED or NOT REACHED"
            fi
            echo ""
            echo "### Configuration status"
            echo '```json'
            if [ -f status.json ]; then
              head -c 12000 status.json
            else
              echo "No status output."
            fi
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  edk2-c21y-compile:
    name: EDK2 - C21Y firmware-volume compile (scaffold)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout C21Y device repository
        uses: actions/checkout@v4
        with:
          ref: port/realme-c21y-rmx3261

      - name: Install EDK2 build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev nasm acpica-tools \
            python3 python3-pip python3-venv python3-setuptools \
            clang lld llvm gcc-aarch64-linux-gnu git
          python3 -m venv "${{ runner.temp }}/edk2-venv"
          . "${{ runner.temp }}/edk2-venv/bin/activate"
          python -m pip install --upgrade pip
          curl -fsSL https://raw.githubusercontent.com/UniXNU/uefi-sheng/sheng/pip-requirements.txt \
            -o "${{ runner.temp }}/edk2-requirements.txt"
          python -m pip install -r "${{ runner.temp }}/edk2-requirements.txt"
          clang --version
          nasm -v
          iasl -v

      - name: Fetch pinned EDK2 and Silicium source branches
        env:
          DEPS: ${{ runner.temp }}/c21y-uefi-deps
        run: |
          set -eux
          mkdir -p "$DEPS"
          git clone --depth 1 --branch release/202608 https://github.com/microsoft/mu_basecore.git "$DEPS/mu_basecore"
          git clone --depth 1 --branch release/202608 https://github.com/microsoft/mu_plus.git "$DEPS/mu_plus"
          git clone --depth 1 --branch release/202608 https://github.com/microsoft/mu_oem_sample.git "$DEPS/mu_oem_sample"
          git clone --depth 1 --branch sheng https://github.com/UniXNU/uefi-sheng.git "$DEPS/uefi-sheng"
          git -C "$DEPS/mu_basecore" rev-parse HEAD
          git -C "$DEPS/mu_plus" rev-parse HEAD
          git -C "$DEPS/mu_oem_sample" rev-parse HEAD
          git -C "$DEPS/uefi-sheng" rev-parse HEAD
          test -f "$DEPS/uefi-sheng/Silicon/Silicium/SiliciumPkg/SiliciumPkg.dsc.inc"
          test -f "$DEPS/mu_basecore/BaseTools/Makefile"

      - name: Build EDK2 BaseTools
        env:
          DEPS: ${{ runner.temp }}/c21y-uefi-deps
        run: |
          set -eux
          # BaseTools Brotli compressor is a Git submodule, not included
          # in a shallow clone of mu_basecore.
          git -C "$DEPS/mu_basecore" submodule update --init --depth 1 \
            BaseTools/Source/C/BrotliCompress/brotli
          test -f "$DEPS/mu_basecore/BaseTools/Source/C/BrotliCompress/brotli/c/common/constants.h"
          make -C "$DEPS/mu_basecore/BaseTools" -j2
          mkdir -p "$DEPS/work"
          ln -s "$DEPS/mu_basecore/BaseTools" "$DEPS/work/BaseTools"

      - name: Compile C21Y EDK2 firmware volume
        env:
          C21Y_ENV: ${{ github.workspace }}/uefi/env-linux.sh
          C21Y_DEPS: ${{ runner.temp }}/c21y-uefi-deps
          C21Y_FD_BASE: "0x80800000"
          C21Y_FD_SIZE: "0x400000"
          C21Y_FD_BLOCKS: "0x400"
          C21Y_BUILD_MODE: DEBUG
          C21Y_JOBS: "2"
        run: |
          set -eux
          # FD_BASE is a compile-time placeholder only. This job must never
          # package or flash the resulting scaffold.
          sh uefi/build-c21y.sh
          test -s uefi/build-c21y/realme-c21y-uefi-scaffold.fd
          stat -c 'C21Y scaffold FV: %s bytes' uefi/build-c21y/realme-c21y-uefi-scaffold.fd

      - name: Upload C21Y EDK2 scaffold artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realme-c21y-edk2-scaffold
          path: uefi/build-c21y/realme-c21y-uefi-scaffold.fd
          if-no-files-found: warn
          retention-days: 7

  # The C21Y scaffold above has no UniXNU.efi, DarwinBoot or payload driver.
  # This job builds the complete UMS512 platform (bbkA2Pkg) that the sibling
  # EEBBK A2 / X2 port already boots: UniXNU.efi + UniXNUDxe +
  # UniXNURamDiskDxe + DarwinBoot + Shell, with the same FD_BASE the C21Y
  # config declares. It is the firmware layer the boot image needs.
  firmware-a2:
    name: firmware (EDK2 + Silicium UMS512 platform)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      DEPS: ${{ github.workspace }}/deps
    steps:
      - name: Checkout C21Y device repository
        uses: actions/checkout@v4
        with:
          ref: port/realme-c21y-rmx3261

      - name: Free runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/chromium /usr/lib/jvm /usr/local/.ghcup \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/Nodejs \
            /opt/hostedtoolcache/PyPy /usr/local/lib/node_modules 2>/dev/null || true
          df -h /

      - name: Install toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-15 lld-15 llvm-15 uuid-dev nasm acpica-tools device-tree-compiler bc
          for t in clang clang++ ld.lld llvm-ar llvm-objcopy llvm-rc llvm-nm llvm-objdump llvm-readelf; do
            sudo ln -sf "/usr/bin/${t}-15" "/usr/bin/$t"
          done
          clang --version | head -1
          iasl -v | head -2 || true
          df -h /

      - name: Clone pinned EDK2 dependencies
        run: |
          set -eux
          mkdir -p "$DEPS"
          clone_pin() {
            name=$1; url=$2; branch=$3; pin=$4
            dir="$DEPS/$name"
            rm -rf "$dir"
            git clone -q --depth 1 --branch "$branch" "$url" "$dir"
            git -C "$dir" fetch -q --depth 1 origin "$pin" 2>/dev/null || true
            if git -C "$dir" checkout -q "$pin" 2>/dev/null; then
              echo "$name: $pin"
            else
              echo "WARN: $name pin $pin not in $branch, using branch tip"
              git -C "$dir" checkout -q "$branch"
            fi
            git -C "$dir" rev-parse --short HEAD
            test -d "$dir/.git"
          }
          clone_pin mu_basecore https://github.com/microsoft/mu_basecore release/202608 26bfddb2194b2058f7ac6163b00a2d94a9b7eac6
          clone_pin mu_plus https://github.com/microsoft/mu_plus release/202608 566cf5c8c2c8adf8e1a337ced1d147bc6246856f
          clone_pin mu_oem_sample https://github.com/microsoft/mu_oem_sample release/202608 9292f9254adb94c5e5bb09a370b9662fcd66a953

          git clone -q --filter=blob:none --no-checkout https://github.com/UniXNU/uefi-sheng "$DEPS/uefi-sheng"
          cd "$DEPS/uefi-sheng"
          git sparse-checkout init --cone
          git sparse-checkout set Silicon/Silicium
          git fetch -q --depth 1 origin sheng
          git checkout -q 0eb4514db0744b8136a3897ab1af93b713c2c27b 2>/dev/null || git checkout -q sheng
          git rev-parse --short HEAD
          ls -d Silicon/Silicium

          cd "$DEPS/mu_basecore"
          git submodule update --init --depth 1 \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            MdePkg/Library/MipiSysTLib/mipisyst \
            MdePkg/Library/BaseFdtLib/libfdt \
            SecurityPkg/DeviceSecurity/SpdmLib/libspdm
          df -h /

      - name: Clone UniXNU core (UniXNU.efi + UniXNUDxe + DarwinBoot)
        run: |
          set -eux
          git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/UniXNU/UniXNU.git UniXNU
          test -f UniXNU/package/UniXNUPkg/Application/UniXNU/UniXNU.inf
          test -f UniXNU/package/UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe.inf
          test -f UniXNU/package/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe.inf
          test -f UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.inf
          du -sh UniXNU

      - name: Build firmware
        run: |
          set -euxo pipefail
          export BBK_A2_DEPS="$DEPS"
          export BBK_A2_REPO="$GITHUB_WORKSPACE/uefi"
          export BBK_A2_ENV="$GITHUB_WORKSPACE/uefi/env-linux.sh"
          export BBK_A2_UNIXNU="$GITHUB_WORKSPACE/UniXNU"
          export EDK_TOOLS_PATH="$DEPS/mu_basecore/BaseTools"
          export WORKSPACE="$DEPS/work"
          mkdir -p "$WORKSPACE"
          test -d "$EDK_TOOLS_PATH/Source/C"
          . "$BBK_A2_ENV"
          make -C "$EDK_TOOLS_PATH/Source/C" -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/basetools-build.log"
          cd "$GITHUB_WORKSPACE/uefi"
          sh ./build-bbk-a2.sh DEBUG 2>&1 | tee "$GITHUB_WORKSPACE/firmware-build.log"

      - name: Verify firmware artifacts
        run: |
          set -eux
          test -f uefi/build/SILICIUM_UEFI.fd
          test "$(stat -c%s uefi/build/SILICIUM_UEFI.fd)" = "$((0x400000))"
          test -f uefi/build/BootShim.bin
          test -f uefi/build/bbk-a2-uefi.bin
          python3 - <<'PY'
          import pathlib, struct
          shim = pathlib.Path('uefi/build/BootShim.bin').read_bytes()
          fd = pathlib.Path('uefi/build/SILICIUM_UEFI.fd').read_bytes()
          assert shim[56:60] == b'ARM\x64', 'ARM64 image magic missing'
          base, size = struct.unpack_from('<QQ', shim, 8)
          assert base == 0x80800000, hex(base)
          assert size == len(shim) + 0x400000, (hex(size), hex(len(shim) + 0x400000))
          assert len(fd) == 0x400000, hex(len(fd))
          print('shim header + FD size contract OK')
          PY
          BUILT="$DEPS/work/Build/bbkA2Pkg/DEBUG_CLANGDWARF/AARCH64"
          test -f "$BUILT/UniXNUPkg/Application/UniXNU/UniXNU/OUTPUT/UniXNU.efi"
          test -f "$BUILT/UniXNUPkg/Driver/UniXNUDxe/UniXNUDxe/OUTPUT/UniXNUDxe.efi"
          test -f "$BUILT/UniXNUPkg/Driver/UniXNURamDiskDxe/UniXNURamDiskDxe/OUTPUT/UniXNURamDiskDxe.efi"
          test -f "$BUILT/DarwinBootPkg/Driver/DarwinBoot/OUTPUT/DarwinBoot.efi"
          echo 'UniXNU.efi + UniXNUDxe + UniXNURamDiskDxe + DarwinBoot built'
          sha256sum uefi/build/SILICIUM_UEFI.fd uefi/build/BootShim.bin uefi/build/bbk-a2-uefi.bin

      - name: Build log in job summary
        if: always()
        run: |
          {
            echo '## firmware build'
            echo '```'
            tail -120 "$GITHUB_WORKSPACE/firmware-build.log" 2>/dev/null || echo 'no firmware log'
            echo '```'
            echo '## basetools build (tail)'
            echo '```'
            tail -40 "$GITHUB_WORKSPACE/basetools-build.log" 2>/dev/null || echo 'no basetools log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-a2
          path: |
            uefi/build/SILICIUM_UEFI.fd
            uefi/build/BootShim.bin
            uefi/build/bbk-a2-uefi.bin
          if-no-files-found: warn
          retention-days: 7

  c21y-bootimg:
    name: C21Y boot.img (raw BootShim + firmware + payload)
    needs: [linux-build-check, firmware-a2]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout C21Y device repository
        uses: actions/checkout@v4
        with:
          ref: port/realme-c21y-rmx3261

      - name: Free runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/chromium /usr/lib/jvm /usr/local/.ghcup \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go /opt/hostedtoolcache/Nodejs \
            /opt/hostedtoolcache/PyPy /usr/local/lib/node_modules 2>/dev/null || true
          df -h /

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packing tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-15 lld-15 llvm-15 device-tree-compiler
          for t in clang ld.lld llvm-ar llvm-objcopy llvm-rc llvm-nm; do
            sudo ln -sf "/usr/bin/${t}-15" "/usr/bin/$t"
          done
          python3 --version
          clang --version | head -1

      - name: Download kernel, DTB and payload
        uses: actions/download-artifact@v4
        with:
          name: realme-c21y-build-check
          path: .

      - name: Download UMS512 firmware volume
        uses: actions/download-artifact@v4
        with:
          name: firmware-a2
          path: uefi/build

      - name: Clone UniXNU core (BootShim compiler + mkbootimg contract)
        run: git clone -q --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU

      - name: Verify boot inputs
        run: |
          set -eux
          test -s uefi/build/SILICIUM_UEFI.fd
          test -s build/realme-c21y-rmx3261.dtb
          PAYLOAD=$(find out -type f -path '*/payload/payload.img' -print -quit)
          test -s "$PAYLOAD"
          ls -l uefi/build/SILICIUM_UEFI.fd build/realme-c21y-rmx3261.dtb "$PAYLOAD"

      - name: Pack boot.img (stock v2 layout, payload as ramdisk)
        run: |
          set -eux
          PAYLOAD=$(find out -type f -path '*/payload/payload.img' -print -quit)
          python3 tools/pack-device-bootimg.py \
            --unixnu "$GITHUB_WORKSPACE/UniXNU" \
            --device "$GITHUB_WORKSPACE" \
            --uefi "$GITHUB_WORKSPACE/uefi" \
            --fd uefi/build/SILICIUM_UEFI.fd \
            --dtb build/realme-c21y-rmx3261.dtb \
            --ramdisk "$PAYLOAD" \
            -o dist/boot.img \
            --report dist/boot-devicelayout.json
          python3 tools/verify-bootimg.py dist/boot.img
          stat -c 'boot.img: %s bytes' dist/boot.img
          sha256sum dist/boot.img | tee dist/boot.img.sha256

      - name: Enforce 35 MiB boot-fit gate
        run: |
          set -eux
          SIZE=$(stat -c%s dist/boot.img)
          echo "boot.img=$SIZE bytes (gate 36700160)"
          test "$SIZE" -le 36700160

      - name: Upload boot image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realme-c21y-bootimg
          path: |
            dist/boot.img
            dist/boot.img.sha256
            dist/boot-devicelayout.json
          if-no-files-found: warn
          retention-days: 7
