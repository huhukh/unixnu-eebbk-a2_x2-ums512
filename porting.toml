[[area]]
id = "memory"
status = "in-progress"
components = []
paths = ["dts/**", "uefi/**/MemoryMapLib/**", "docs/stock-firmware-audit.md"]
inputs = [
  "User-provided stock C21Y boot.img, base DTB and dtbo.img.",
  "Android runtime /proc/zoneinfo and MemTotal collected over ADB.",
  "UniXNU EDK2 MemoryMapLib implementation and DarwinBoot memory handoff requirements."
]
configuration = [
  "Do not copy the EEBBK 1 GiB or 2 GiB memory map or its reserved-memory addresses.",
  "Do not treat the Android zone layout as a complete UEFI memory descriptor table.",
  "Keep the C21Y DTS memory node unchanged until the effective boot handoff and merged stock FDT are reconciled.",
  "A C21Y firmware map must separately account for usable RAM, firmware, bootloader, initrd, secure-world, modem/DSP, framebuffer and ramoops ranges."
]
procedure = [
  "Decode and merge the stock C21Y base DTB and DTBO using a real overlay implementation.",
  "Compare the merged tree with Android runtime PFN zones and reserved-memory regions.",
  "Audit the C21Y bootloader handoff addresses and identify kernel, FDT, initrd and firmware placement.",
  "Create a C21Y-specific MemoryMapLib only after all overlaps and ownership boundaries are accounted for."
]
findings = [
  "The base stock DTB and the public C21Y vendor source ums512-mach.dtsi both describe 2 GiB at 0x80000000.",
  "The matching S19610AA1 board overlay adds reservations but does not enlarge the memory node.",
  "The inspected ARM64 kernel setup/memblock path contains no C21Y-specific hard-coded addition of the second bank; a bootloader-side live-FDT fixup is plausible but unproven.",
  "Android /proc/zoneinfo reports a DMA zone beginning at PFN 524288 with 524288 pages and a Normal zone beginning at PFN 1048576 with 524287 pages; with 4 KiB pages these are adjacent approximately 2 GiB ranges beginning at 0x80000000 and 0x100000000.",
  "Android MemTotal is 3875088 kB; the populated zones' managed counts are consistent with approximately 3.69 GiB managed RAM.",
  "The repository MemoryMapLib is hard-coded for EEBBK A2 / X2 / X2P (ums512_1h190), not C21Y (ums512_1h10), and must not be reused as a C21Y map.",
  "The C21Y branch does not yet have a C21Y-specific EDK2 platform package or MemoryMapLib."
]
completion = [
  "The merged stock FDT and runtime RAM ranges are reconciled.",
  "Every physical memory range and firmware reservation is accounted for.",
  "The C21Y UEFI memory map is consistent with the actual boot handoff and does not overlap firmware or kernel allocations."
]
limits = [
  "The source of the second runtime RAM bank has not yet been identified; the live FDT passed by the bootloader has not yet been read.",
  "C21Y-specific bootloader kernel/FDT/initrd and UEFI firmware placement addresses are not established.",
  "The exact UEFI usable map and all secure-world, modem/DSP and framebuffer reservations are not established."
]
next_action = [
  "Read the live FDT from /sys/firmware/fdt if exposed to ADB and compare its memory node with the original embedded DTB; then reconcile the merged reserved-memory tree."
]
evidence = [
  { kind = "device", reference = "docs/stock-firmware-audit.md", result = "Stock image, overlay and runtime memory audit." },
  { kind = "source", reference = "https://unixnu.com/porting/device-tree", result = "UniXNU hardware DTB and memory-node requirements." },
  { kind = "source", reference = "https://unixnu.com/concepts/payload", result = "DarwinBoot excluded-range and memory-window handoff." }
]

