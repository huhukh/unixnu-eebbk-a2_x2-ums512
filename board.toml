
schema_version = 2

[board]
name = "realme-c21y-rmx3261"
soc = "UMS512"
soc_source = "ums512"
os_profile = "ios-16.5-20F66"
kit = "realme-c21y-rmx3261"
description = "Realme C21Y RMX3261 (S19610AA1, Unisoc T610)"

[components]
# Minimal first-bring-up configuration.
# Storage, display, and GPU are not enabled until their
# C21Y-specific implementations are verified.
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "XnuPrelink",
  "DarwinBoot"
]

[kernel]
defconfig = "realme-c21y-rmx3261_defconfig"

config_fragments = [
  "arch:configs/common.config",
  "soc:configs/ums512.config",
  "os:configs/ios.config"
]

patch_series = [
  "soc:patches/xnu/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series"
]

archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  # MockFS is an offline test-root fixture, not required for the native C21Y kernel.
  "build-libpthread-kernel.py"
]

[device_tree]
source = "device:dts/realme-c21y-rmx3261.dts"
include_dirs = ["soc:dts"]

[firmware]
# scripts/unixnu/bootimg.py loads uefi/Resources/Configs/<config>.toml from
# --uefi and takes [boot_shim] and [uefi_fd] from it. The C21Y values there
# are stock-derived placeholders; see uefi/C21Y-UEFI-STATUS.md.
config = "realme-c21y"

[bootimg.image]
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x5400000
tags_offset = 0x100
pagesize = 2048
header_version = 2
# Stock boot.bin carries a raw AArch64 Image (no gzip). U-Boot 2015.07
# start_linux loads the kernel field to 0x80080000 without decompressing it,
# and BootShim.S emits the "ARM\x64" header when requires_kernel_header=1.
kernel_compression = "none"

[payload]
volume = "UNIXNU"
loader = "firmware"
# 30 MiB keeps boot.img (header + 4 MiB BootShim/FD + payload + DTB) under
# the 35 MiB boot-fit gate and inside the 64 MiB boot_a/b slot. The 192 MiB
# default cannot fit any existing C21Y partition.
size_mib = 30
title = "UniXNU Realme C21Y"
panic_screen = false
timeout = 0
kernel_args = [
  "-v",
  "debug=0x144",
  "serial=3",
  "amfi_get_out_of_my_way=1"
]

[payload.adt]
unique_chip_id = "required"
psci_method = "smc"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
# scripts/unixnu/devicetree.py:313 does int(options['chip_id'], 16) whenever a
# unique chip ID is passed, so the key is mandatory here; without it the ADT
# generation dies with KeyError. The value is the one the selected OS profile
# already declares (os-profiles/ios-16.5-20F66/profile.toml: [ipsw] chip_id =
# 32789 = 0x8015, the D22AP identity of the iPhone10,3 kernel we boot). It is
# an OS-identity value, NOT a Unisoc hardware ID: no vendor source documents a
# UMS512 "chip-id" DT property, so inventing one would be unfounded.
chip_id = "0x8015"

[kernel.prelink]
# `unixnu build kernel --skip-prelink` still calls kernel.prelink(), which reads
# spec['kernel'] before it checks skip_prelink (scripts/unixnu/kernel.py:320).
# xnu-8796's build-xnu-4k-baseline.sh links the unstripped Mach-O here; the
# upstream .unstripped.noctf name belongs to xnu-10063 and never exists.
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"
enabled = true
components = ["DarwinBoot", "XnuPrelink"]
