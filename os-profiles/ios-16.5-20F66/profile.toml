# iOS 16.5 (20F66) OS profile for UniXNU, iPhone X (iPhone10,3 / D22AP) identity.
#
# UniXNU reads OS profiles only from its own profiles/os/. This copy lives in the device
# repository until it is contributed upstream; scripts/install-os-profile.sh links it into
# the UniXNU checkout (the package workflow runs it before resolving).
#
# Kernel: xnu-8796.121.2, the release HakiOS has run iOS 16.5 on since its first boot.
# IPSW facts: Apple's iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw. The OS cryptex hash was
# measured locally (HakiOS sysimage/cryptex-os.dmg) and agrees with the value published by
# UniXNU-nio's ios-16.5-20F66 profile, which also supplied the kernelcache pin and the prelink
# roots below.

[os]
name = "ios-16.5-20F66"
darwin = "22.5.0"
xnu_version = "8796.121.2"
xnu_revision = "c54f35ca767986246321eb901baf8f5ff7923f6a"
driverkit_tag = "xnu-8796.121.2"
trustcache_tag = "xnu-8796.101.5"
abi = ["IOGPUFamily", "IOHIDFamily-2031.120.4", "IOMobileGraphicsFamily"]

[ipsw]
url = "https://updates.cdn-apple.com/2023SpringFCS/fullrestores/032-85130/6AB0D10A-8AF9-4F6C-8CF5-A1B315CABE88/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw"
product = "iPhone10,3"
version = "16.5"
build = "20F66"
device_class = "d22ap"
chip_id = 32789
board_id = 6
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"096-04088-077.dmg" = "64354ba3475d3c34d6fc531f75585a7b24af0fdb7a3a8a2bdf95c7f351a3f290"
"096-04666-078.dmg" = "2279bf443856fcb6a3f00b1fa06a32ba02a66fdf6ab6b12019462c7498aafdd3"

# Kernel prelink settings are deliberately omitted until C21Y has a matching, validated
# iOS 16.5 kernelcache and board-independent prelink tool. This profile currently pins
# OS identity and XNU source revision for kernel compilation only.

[payload]
text_fixups = []
# DarwinBoot reads one bundle (count, offsets, version-2 modules), not the IPSW IM4Ps. This is
# scripts/bundle-ipsw-trust.py over the unchanged StaticTrustCache (096-04088-077.dmg.trustcache,
# sha256 df0f60fd..., 2759 entries) and Cryptex1,SystemTrustCache (096-04666-078.dmg.trustcache,
# sha256 501fa23c..., 61 entries), in that order: 67740 bytes.
trust_cache_sha256 = [
  "d29198a360894248df37b1aab9c470596903048c7333c732e7d7a7f251dbbd5c",
]

# Identity: the same iPhone X that HakiOS's loader presents by default (xnuloader identity.h).
[adt.root.string]
model = "iPhone10,3"
target-type = "D22"
compatible = "D22AP"

[adt.chosen.string]
osenvironment = "main"
crypto-hash-method = "sha2-384"

[adt.chosen.u32]
certificate-production-status = 0
effective-production-status-ap = 0
certificate-security-mode = 1
effective-security-mode-sep = 1
amfi-only-platform-code = 1

[adt.product.string]
product-name = "iPhone X"
product-description = "iPhone X"
artwork-device-idiom = "phone"
# HakiOS shows that iOS renders black with "P3" on these sRGB panels (xnuloader gamut_p3);
# the board overrides this when its panel is sRGB.
artwork-display-gamut = "P3"
compatible-device-fallback = "iPhone9,2"
graphics-featureset-class = "APPLE4"
graphics-featureset-fallbacks = "APPLE3:APPLE3v1:APPLE2:APPLE1:GLES2,0"

[adt.product.u32]
artwork-device-subtype = 2436
artwork-scale-factor = 3
device-perf-memory-class = 4
oled-display = 1
thin-bezel = 1

[adt.product.bytes]
product-id = "fd079b298144a7deb4d7c87fef3eb474d8f0e7eb"

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["volup", "voldown", "hold", "ringerab"]

[adt.buttons.u32]
home-button-type = 2
button-priority_hold = 1
button-priority_volup = 2
button-priority_voldown = 2
opposed-power-vol-buttons = 1

[adt.defaults.u32]
"kern.maxvnodes" = 10000

[userdata]
windows = [{ name = "OS", component = "OS" }, { name = "SystemOS", component = "Cryptex1,SystemOS", optional = true }]

[root]
# The APFS volume of 096-04088-077.dmg ("SydneyF20F66.D22D221OS"), read with 7z l -slt on the
# pinned image (sha256 64354ba3...).
os_volume_uuid = "97A3EB1A-5218-4936-BC85-9574EC2C8CC9"
